<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .hero {
        display: flex;
        gap: 500px;
      }
      * {
        margin: 0;

        padding: 0;
        box-sizing: border-box;
      }
      h1 {
        writing-mode: sideways-lr;
        letter-spacing: 2px;

        padding: 200px;

        height: 100vh;
        margin-right: 50px;
        font-family: "Times New Roman", Times, serif;
        background: linear-gradient(
          to left,
          rgb(236, 34, 34),
          rgb(76, 185, 72),
          rgb(206, 206, 59),
          rgb(80, 62, 143),
          rgb(184, 59, 184)
        );
        -webkit-background-clip: text;
        color: transparent;
        display: inline-block;
        font-weight: bolder;
      }
      button {
        background-color: rgb(236, 34, 34);
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>INDOMIE</h1>
      <button>CLICK TO GET A FREE CARTON</button>
    </div>
  </body>
</html>
